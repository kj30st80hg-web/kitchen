  <style>
    /*作品集專屬佈局微調，避免被上方固定導覽列遮擋 */
    .portfolio-page-section {
      padding-top: 130px; 
    }

    /* 核心修改：將作品網格調整為一排三個 ==================== */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 從原本的 2 改為 3 ==================== */
      gap: 30px; /* 卡片間距保持不變 */
    }

    /* 高級感圖片藝廊卡片樣式 */
    .gallery-card {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      aspect-ratio: 4 / 3; /* 統一照片比例為 4:3，避免直圖橫圖跑版 */
      cursor: pointer;
      display: block; /* 讓 <a> 標籤能撐開 */
    }

    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 確保圖片不變形完美填滿 */
      transition: transform 0.5s ease;
    }

    /* 滑鼠移上去時，照片微微放大，很有設計感 */
    .gallery-card:hover .gallery-img {
      transform: scale(1.08);
    }

    /* ✅ 這裡我移除了原本用來顯示「台北大安」的黑色半透明遮罩 CSS ==================== */
    /* ✅ 這裡我移除了原本用來顯示「台北大安」的文字 CSS ==================== */

    /* 針對手機版的響應式調整 */
    @media (max-width: 992px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr); /* 平板尺寸改為一排兩個 */
      }
    }
    @media (max-width: 768px) {
      .product-grid {
        grid-template-columns: 1fr; /* 手機尺寸改為一排一個 */
      }
    }
  </style>

  <script>
    // 為了讓代碼更快捷，我預設多幫您加了一張Unsplash的圖來展示一排三個的效果，
    // 未來要狂加新照片，只需依樣畫葫蘆補在下面陣列即可：
    const imagesData = [
      { src: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=600", location: "台北大安" },
      { src: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=600", location: "新北板橋" },
      { src: "https://images.unsplash.com/photo-1565183997392-2f6f122e5912?q=80&w=600", location: "台北信義" },
      // 新照片範例
      { src: "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=600", location: "台中西屯" },
    ];

    // 以下是自動把資料渲染到網頁上的程式，已更新 HTML 結構以實現點擊放大，並移除了 Hover 文字層
    const container = document.getElementById('portfolio-container');
    imagesData.forEach(item => {
      // 這裡非常快捷，不需要寫那種長長的簡介代碼，只要丟入圖片網址和地區即可
      cardHtml = `
        <a href="${item.src}" class="gallery-card glightbox" data-gallery="gallery">
          <img src="${item.src}" alt="${item.location}實績" class="gallery-img">
          </a>
      `;
      // 將 HTML 字符串轉換為 DOM 元素並插入容器末尾
      container.insertAdjacentHTML('beforeend', cardHtml);
    });

    // 初始化 GLightbox 燈箱，讓圖片點擊能放大
    const lightbox = GLightbox({
      loop: true,       // 允許左右循環切換照片
      draggable: true, // 支援手機上滑動切換
    });
  </script>
