    /* 作品集專屬微調：避免被上方固定導覽列遮住 */
    .portfolio-page-section {
      padding-top: 130px; 
    }
    .portfolio-intro-text {
      text-align: center;
      color: #666666;
      font-size: 16px;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    /* 方案 2：極簡純圖片藝廊網格樣式 */
    .gallery-card {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      aspect-ratio: 4 / 3; /* 統一照片比例為 4:3，不論直圖橫圖都不跑版 */
      cursor: pointer;
    }

    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 確保圖片不變形完美填滿 */
      transition: transform 0.5s ease;
    }

    /* 滑鼠移上去時，照片微微放大 */
    .gallery-card:hover .gallery-img {
      transform: scale(1.08);
    }

    /* 懸停時的質感黑色半透明遮罩 */
    .gallery-mask {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); 
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .gallery-card:hover .gallery-mask {
      opacity: 1;
    }

    /* 遮罩上的極簡白字地名 */
    .gallery-mask span {
      color: #ffffff;
      font-size: 16px;
      letter-spacing: 2px;
      border-bottom: 1px solid #ffffff;
      padding-bottom: 5px;
    }
  </style>

      { src: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=600", location: "新北板橋" },

      // 新照片範例（把前面雙斜線拿掉就可以用）：
      // { src: "這裡放第四張照片網址.jpg", location: "台中西屯" },
    ];

    // 以下是自動把資料渲染到網頁上的程式，不用修改它
    const container = document.getElementById('portfolio-container');
    imagesData.forEach(item => {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.innerHTML = `
        <img src="${item.src}" alt="${item.location}實績" class="gallery-img">
        <div class="gallery-mask"><span>${item.location}</span></div>
      `;
      container.appendChild(card);
    });
  </script>
