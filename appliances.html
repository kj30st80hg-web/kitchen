  <style>
    /* 基礎架構修正 */
    html { scroll-behavior: smooth; overflow-x: hidden; }
    body { width: 100%; background-color: #fcfcfc; color: #333333; line-height: 1.6; margin: 0; }

    /* 智能家電專用極簡奢華樣式 */
    .appliance-container {
      max-width: 1280px;
      margin: 40px auto;
      padding: 100px 20px 0 20px;
      display: flex;
      gap: 30px;
      overflow: visible;
      align-items: flex-start;
    }

    .appliance-sidebar {
      width: 240px;
      flex-shrink: 0;
      position: sticky;
      top: 150px;
      height: fit-content;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #eee;
      z-index: 100;
    }

    .sidebar-title { font-size: 17px; font-weight: bold; margin-bottom: 18px; color: #111; border-bottom: 2px solid #333; padding-bottom: 10px; }
    .sidebar-menu { list-style: none; padding: 0; margin: 0; }
    .sidebar-menu li { margin-bottom: 12px; position: relative; }
    .sidebar-menu a { text-decoration: none; color: #666; font-size: 15px; transition: all 0.3s; display: block; padding: 6px 0; }
    .sidebar-menu li:hover > a { color: #004d80; font-weight: bold; }

    /* 右側彈出子選單 */
    .submenu { position: absolute; left: 100%; top: -10px; background: #ffffff; border: 1px solid #e0e0e0; box-shadow: 5px 5px 15px rgba(0,0,0,0.08); border-radius: 6px; padding: 10px 0; min-width: 140px; list-style: none; opacity: 0; visibility: hidden; transition: opacity 0.3s ease; }
    .has-submenu:hover .submenu { opacity: 1; visibility: visible; }
    .submenu a { padding: 10px 20px; font-size: 14px; color: #555; }

    .appliance-content { flex: 1; }
    .page-main-title { font-size: 32px; margin-bottom: 10px; letter-spacing: 2px; }
    .brand-group { margin-bottom: 70px; scroll-margin-top: 120px; }
    .brand-header { font-size: 24px; border-left: 4px solid #004d80; padding-left: 15px; margin-bottom: 25px; font-weight: bold; }
    .appliance-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
    
    .appliance-card { background: #fff; border: 1px solid #eee; border-radius: 8px; transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; }
    .appliance-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.06); }
    .appliance-img-box img { width: 100%; height: 200px; object-fit: cover; }

    #bosch .appliance-img-box img, #amica .appliance-img-box img, #best .appliance-img-box img, #gejp .appliance-img-box img, #hafele .appliance-img-box img, #unihopper .appliance-img-box img, #prince .appliance-img-box img { object-fit: contain; }

    .appliance-info { padding: 15px; flex-grow: 1; }
    .brand-badge { font-size: 10px; color: #fff; background: #333; padding: 2px 6px; border-radius: 20px; }
    .appliance-name { font-size: 14px; font-weight: bold; margin: 8px 0; }
    .appliance-desc { font-size: 12px; color: #666; margin-bottom: 12px; }
    .view-spec-btn { display: block; text-align: center; background: #f8f9fa; color: #333; padding: 8px 0; font-size: 12px; font-weight: bold; border-radius: 4px; border: 1px solid #ddd; text-decoration: none; }
    .view-spec-btn:hover { background: #004d80; color: #fff; }

    /* RWD */
    @media (max-width: 768px) {
      .appliance-container { flex-direction: column; }
      .appliance-sidebar { width: 100%; position: static; }
      .appliance-grid { grid-template-columns: 1fr; }
    }
  </style>
