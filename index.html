<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極致美學廚具 | 職人打造烹飪空間</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">凱勤廚具 kitchen</div>
    <ul class="nav-links">
      <li><a href="#">品牌故事</a></li>
      <li><a href="#">經典廚具</a></li>
      <li><a href="#">智能家電</a></li>
      <li><a href="#">聯絡我們</a></li>
    </ul>
  </nav>

  <header class="hero-section">
    <div class="hero-content">
      <h1>打造內斂奢華的烹飪舞台</h1>
      <p>帝雉石英石 ✕ C型隱形把手美學，兼具低調奢華與極簡線條</p>
      <a href="#products" class="btn-primary">探索經典系列</a>
    </div>

  <section id="products" class="product-section">
    <h2>精選作品集</h2>
    <div class="product-grid">
      
      <div class="product-card">
        <div class="product-img-placeholder">隨紋不鏽鋼中島系列</div>

          <h3>職人隨紋不鏽鋼中島</h3>
          <p>採用 1.2mm 厚實不鏽鋼，獨特亂紋打磨工藝，抗刮耐磨，完美融入現代居家。</p>
          <span class="price">客製化定製</span>
        </div>
      </div>

      <div class="product-card">
        <div class="product-img-placeholder">C-Type 隱形把手極簡櫥櫃</div>
        <div class="product-info">
          <h3>C-Type 極簡無把手下櫃</h3>
          <p>極致純平立面設計，內嵌式 C 型槽工藝，開合順暢，消弭視覺雜訊。</p>
          <span class="price">客製化定製</span>
        </div>
      </div>

    </div>
